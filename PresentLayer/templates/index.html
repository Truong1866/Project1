<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Vision - Camera Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: white; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden;
        }
        .card h3 { margin: 0; padding: 10px; background: #2c3e50; color: white; text-align: center; }
        .card img { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>
    <h1>Hệ thống Giám sát Thông minh (Smart Vision)</h1>

    <div class="grid">
        {% for cam_id in cameras %}
        <div class="card">
            <h3>{{ cam_id }}</h3>
            <!-- Thẻ img liên tục lấy luồng ảnh mới từ endpoint /video_feed/ -->
            <img src="/video_feed/{{ cam_id }}" alt="Stream {{ cam_id }}">
        </div>
        {% endfor %}
    </div>
</body>
</html>
